name: Release

# The release train tagged this repository at its verified head and asked
# for a release: publish one with this tag's own changelog. The train is
# the only tagger, so this workflow never tags anything itself.

on:
  repository_dispatch:
    types: [train-tagged]

permissions:
  contents: write

jobs:
  release:
    if: github.event.action == 'train-tagged'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes need the previous tag and the commits between them
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changelog for this tag
        run: node .github/scripts/release-notes.mjs --repo-only "$TAG" > notes.md && cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ github.event.repository.name }} ${{ env.TAG }}
          body_path: notes.md
          prerelease: true
