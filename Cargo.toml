[package]
name = "opurom-server"
version = "0.2.0"
edition = "2021"
publish = false
description = "OPUROM R2/R4/R5 backend runtime: HTTP/1.1, routing, fault isolation, SSR host, opt-in hardening, and service lowering"

[lib]
name = "opurom_server"
path = "src/lib.rs"

[[bin]]
name = "opurom-server"
path = "src/bin/opurom-server.rs"

[[bin]]
name = "opurom-serverc"
path = "src/bin/opurom-serverc.rs"

[dependencies]
flate2 = "1.1.11"
serde_json = "1.0.154"

# R7 transport dependencies, pinned exactly.
# rustls: the TLS 1.2/1.3 implementation of the optional HTTPS listener.
# rustls-pemfile: reading the PEM certificate and private key files.
# rcgen: generating the self-signed certificate when no PEM file is given.
# sha2: the SHA-256 fingerprint of the certificate that is logged.
# sha1: the SHA-1 of the WebSocket handshake key, as RFC 6455 requires.
# base64: the base64 encoding of the handshake accept value and of a key.
# getrandom: the random bytes for a WebSocket key and for a frame mask.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "=2.2.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "=0.10.9"
sha1 = "=0.10.6"
base64 = "=0.23.1"
getrandom = "=0.2.17"
