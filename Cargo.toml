[package]
name = "opurom-server"
version = "0.2.0"
edition = "2021"
publish = false
description = "OPUROM R2 backend runtime: std-only HTTP/1.1, routing, fault isolation, SSR host, and service lowering"

[lib]
name = "opurom_server"
path = "src/lib.rs"

[[bin]]
name = "opurom-server"
path = "src/bin/opurom-server.rs"

[[bin]]
name = "opurom-serverc"
path = "src/bin/opurom-serverc.rs"

[dependencies]
serde_json = "1.0.154"
