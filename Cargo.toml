[package]
name = "opurom-server"
version = "0.2.0"
edition = "2021"
publish = false
description = "OPUROM R2/R4/R5 backend runtime: HTTP/1.1, routing, fault isolation, SSR host, opt-in hardening, and service lowering"

[lib]
name = "opurom_server"
path = "src/lib.rs"

[[bin]]
name = "opurom-server"
path = "src/bin/opurom-server.rs"

[[bin]]
name = "opurom-serverc"
path = "src/bin/opurom-serverc.rs"

[dependencies]
flate2 = "1.1.11"
serde_json = "1.0.154"
